name: ci

# Not yet run on GitHub (the repo has not been pushed). Every step below is a command that was run locally; see
# docs/EVIDENCE.md for the dated outputs. Action versions are major tags and should be re-checked on first push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.2        # the version the chart was tested with (Helm 4 server-side apply, --rollback-on-failure)
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  CALICO_VERSION: v3.28.2

jobs:
  python:
    # Python 3.12 and the gateway's pinned requirements: the same interpreter and dependencies as the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r app/gateway/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit -q
      - run: tests/scripts/test-redact.sh

  chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # bash with -eo pipefail, so a failing `helm template | kubeconform` fails the step
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # helm lint + template for every values file, strict duplicate-key check, kubeconform -strict (container image),
      # and the "bad values must be rejected" tests.
      - run: PYBIN=python scripts/chart-check.sh

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t llm-guardrail/gateway:ci app/gateway
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: llm-guardrail/gateway:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    needs: [python, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_CLUSTER: "1"   # a missing cluster fails the integration tests instead of skipping them
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r app/gateway/requirements.txt -r requirements-dev.txt
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
      # Creates the 3-node Calico cluster, installs ingress-nginx, builds both images and loads them into kind.
      - name: Cluster
        run: CNI=calico scripts/cluster-up.sh
      - name: Install chart
        run: |
          helm install guardrail charts/llm-guardrail -n guardrail --create-namespace \
            -f charts/llm-guardrail/values-kind.yaml --wait --timeout 240s
      - run: helm test guardrail -n guardrail --logs
      - name: Integration tests
        run: pytest tests/integration -v -rs
      - name: Environment assessment with the NetworkPolicy probe
        run: PROBE_NETPOL=1 scripts/preflight.sh
      - run: drills/06-networkpolicy-enforcement.sh
      - name: Upgrade, image upgrade and rollback
        run: scripts/upgrade-rollback-demo.sh
      - name: Guardrail evaluation (measurement only, prints false-positive / false-negative rates)
        run: python scripts/eval_guardrails.py --json eval-results.json
      - name: Support bundle
        if: always()
        run: scripts/collect-diagnostics.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-and-eval
          path: |
            diagnostics-*.tar.gz
            eval-results.json
