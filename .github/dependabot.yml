# Keeps the pinned versions current. Actions are pinned to commits, so Dependabot proposes the new commit and
# release comment; pip and Docker cover the gateway/mock-llm requirements and the base images.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directories: [/app/gateway, /app/mock-llm, /]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/app/gateway, /app/mock-llm]
    schedule: { interval: weekly }
    # Stay on the tested Python minor version; a jump to 3.15 failed CI (PRs #2 and #4). Patch bumps still come.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
