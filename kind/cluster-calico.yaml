# Same topology as cluster.yaml, but with kind's default CNI disabled so Calico can be installed.
# Calico enforces NetworkPolicy for certain. scripts/cluster-up.sh uses this file when CNI=calico.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16 # Calico's default pool, so the stock manifest works unmodified
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
