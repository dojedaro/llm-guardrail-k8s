# 1 control-plane + 2 workers. Sized for a laptop with ~8 GB for Docker.
# If memory is tight, delete one worker block (the chart still runs; the topology-spread and PodDisruptionBudget demos are less interesting).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # The label + port mappings let ingress-nginx (kind's documented setup) receive host traffic.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080 # http://localhost:8080 -> ingress controller (8080 avoids needing admin rights for :80)
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
