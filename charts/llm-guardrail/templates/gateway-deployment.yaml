apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-guardrail.gatewayName" . }}
  labels:
    {{- include "llm-guardrail.gatewayLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "llm-guardrail.gatewaySelector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "llm-guardrail.gatewayLabels" . | nindent 8 }}
      annotations:
        # A policy change alters this hash, which changes the pod template, which rolls the pods.
        checksum/policy: {{ include (print $.Template.BasePath "/configmap-policy.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      # Must exceed preStop + the longest in-flight request (upstream timeout) or pods are SIGKILLed mid-request.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      {{- include "llm-guardrail.pullSecrets" . | nindent 6 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread replicas over nodes so one node drain or failure cannot take out every replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "llm-guardrail.gatewaySelector" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "llm-guardrail.image" (list . .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: UPSTREAM_KIND
              value: {{ .Values.gateway.upstream.kind | quote }}
            - name: UPSTREAM_URL
              value: {{ include "llm-guardrail.upstreamUrl" . | quote }}
            - name: UPSTREAM_MODEL
              value: {{ .Values.gateway.upstream.model | quote }}
            - name: UPSTREAM_TIMEOUT_S
              value: {{ .Values.gateway.upstream.timeoutSeconds | quote }}
            - name: UPSTREAM_MAX_TOKENS
              value: {{ .Values.gateway.upstream.maxTokens | quote }}
            - name: UPSTREAM_EFFORT
              value: {{ .Values.gateway.upstream.effort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            - name: POLICY_PATH
              value: /etc/guardrail/policy.yaml
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            {{- if .Values.gateway.caBundle.configMapName }}
            - name: SSL_CERT_FILE
              value: /etc/guardrail-ca/{{ .Values.gateway.caBundle.key }}
            {{- end }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if eq .Values.gateway.upstream.kind "anthropic" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-guardrail.secretName" . }}
                  key: {{ .Values.gateway.secret.key }}
            {{- end }}
          lifecycle:
            # Keep serving for a few seconds after SIGTERM: Service endpoint removal propagates to
            # kube-proxy and the ingress controller asynchronously, so without this a rolling update
            # can send requests to a pod that is already shutting down.
            preStop:
              exec:
                command: ["sleep", {{ .Values.gateway.preStopSleepSeconds | quote }}]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- include "llm-guardrail.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: policy, mountPath: /etc/guardrail, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.gateway.caBundle.configMapName }}
            - { name: ca, mountPath: /etc/guardrail-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ .Release.Name }}-policy
        - name: tmp
          emptyDir: {}
        {{- if .Values.gateway.caBundle.configMapName }}
        - name: ca
          configMap:
            name: {{ .Values.gateway.caBundle.configMapName }}
        {{- end }}
