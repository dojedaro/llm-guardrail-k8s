{{- /* A PDB with minAvailable 1 and a single replica would block every node drain forever, so only render it for 2+ replicas. */}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.gateway.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llm-guardrail.gatewayName" . }}
  labels:
    {{- include "llm-guardrail.gatewayLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "llm-guardrail.gatewaySelector" . | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llm-guardrail.gatewayName" . }}
  labels:
    {{- include "llm-guardrail.gatewayLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the API is exposed. /metrics, /readyz and /healthz stay cluster-internal.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "llm-guardrail.gatewayName" . }}
                port:
                  name: http
{{- end }}
