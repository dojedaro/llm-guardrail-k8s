{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llm-guardrail.gatewayName" . }}
  labels:
    {{- include "llm-guardrail.gatewayLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the API is exposed. /metrics, /readyz and /healthz stay cluster-internal.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "llm-guardrail.gatewayName" . }}
                port:
                  name: http
{{- end }}
