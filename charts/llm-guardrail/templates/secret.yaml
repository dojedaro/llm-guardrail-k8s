{{- if and (eq .Values.gateway.upstream.kind "anthropic") (not .Values.gateway.secret.existingSecret) }}
{{- /* Convenience path. In production prefer existingSecret so the key never passes through Helm values/release history. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-guardrail.secretName" . }}
  labels:
    {{- include "llm-guardrail.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.gateway.secret.key }}: {{ required "gateway.secret.apiKey or gateway.secret.existingSecret is required when upstream.kind=anthropic" .Values.gateway.secret.apiKey | quote }}
{{- end }}
