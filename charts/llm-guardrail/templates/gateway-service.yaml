apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-guardrail.gatewayName" . }}
  labels:
    {{- include "llm-guardrail.gatewayLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "llm-guardrail.gatewaySelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
