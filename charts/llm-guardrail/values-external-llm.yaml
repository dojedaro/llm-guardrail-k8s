# Use the Anthropic Messages API instead of the mock LLM.
#
# Before installing:
#   kubectl create secret generic anthropic-api-key --from-literal=api-key="$ANTHROPIC_API_KEY"
#   resolve the API host to IPs the firewall/egress team will allow, then pass them:
#   --set 'networkPolicy.externalLLM.cidrs={203.0.113.10/32}'   (example address, not real)
gateway:
  upstream:
    kind: anthropic
    url: https://api.anthropic.com
    model: claude-haiku-5-5
  secret:
    existingSecret: anthropic-api-key
    key: api-key

mockLlm:
  enabled: false

networkPolicy:
  enabled: true
  externalLLM:
    enabled: true
    cidrs: [] # REQUIRED: the chart refuses to render with an empty list
    port: 443
