# Default values: runs fully in-cluster with the mock LLM (no API key, no internet).

global:
  # Prefix for every image, e.g. "registry.customer.local:5000". Leave empty for Docker Hub / local images.
  imageRegistry: ""
  # Names of existing docker-registry Secrets for a private registry that needs credentials.
  imagePullSecrets: []

gateway:
  image:
    repository: llm-guardrail/gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080 # the container listens here (passed to the image as PORT)
  logLevel: INFO
  # Rolling updates: preStop sleep lets endpoint removal propagate before the process gets SIGTERM.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # Extra environment variables, e.g. an egress proxy for the external LLM:
  #   - { name: HTTPS_PROXY, value: "http://proxy.corp.example:3128" }
  #   - { name: NO_PROXY, value: ".svc,.cluster.local,10.0.0.0/8" }
  extraEnv: []
  # Private CA bundle (PEM) from an existing ConfigMap, for TLS-inspecting proxies or private LLM endpoints.
  # Sets SSL_CERT_FILE, which REPLACES the default trust store: include public roots if the gateway also needs them.
  caBundle:
    configMapName: ""
    key: ca.crt
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Scheduling: pin to labelled nodes, tolerate taints, annotate pods (e.g. for a service mesh or Prometheus).
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  upstream:
    kind: mock # mock | anthropic
    url: "" # empty = in-cluster mock-llm Service (kind: mock) or https://api.anthropic.com
    model: claude-haiku-5-5
    timeoutSeconds: 10
    # anthropic only. Thinking tokens count against maxTokens, so keep it well above the longest answer you need;
    # a low effort keeps short chat answers from being spent on reasoning. Empty effort sends none.
    maxTokens: 4096
    effort: low
  # API key for kind: anthropic. Either let the chart create a Secret from apiKey,
  # or point at a Secret you created yourself with existingSecret (preferred).
  secret:
    existingSecret: ""
    key: api-key
    apiKey: ""

mockLlm:
  enabled: true
  image:
    repository: llm-guardrail/mock-llm
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  # Fault injection for incident drills.
  faults:
    latencyMs: 0
    errorRate: 0

# Rendered into a ConfigMap and mounted at /etc/guardrail/policy.yaml.
# Changing anything here rolls the gateway pods (checksum annotation).
policy:
  version: "2026-11-27.1"
  pii:
    mode: redact # redact | block
    rules: [email, phone, credit_card, kr_rrn, secret]
  injection:
    enabled: true
    threshold: 3
  output:
    redact_pii: true

# Rendered only when gateway.replicas > 1 (with one replica it would block every node drain).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Exposes /v1 only (never /metrics or /readyz). kind maps host port 8080 to the ingress controller.
ingress:
  enabled: false
  className: nginx
  host: guardrail.localtest.me
  annotations: {}
  tls:
    enabled: false
    secretName: "" # an existing kubernetes.io/tls Secret

networkPolicy:
  enabled: true
  # Pods in THIS namespace labelled guardrail-client=true may also call the gateway (the helm test pod, drills).
  # DNS egress for the gateway and client pods. Leave true; the DNS drill sets it false to reproduce an outage.
  allowDns: true
  # Namespaces whose pods may call the gateway (matched on kubernetes.io/metadata.name).
  allowedNamespaces: [ingress-nginx]
  # Source CIDRs that may call the gateway. Needed when the ingress controller runs with hostNetwork
  # (its traffic arrives from the node IP, which a namespaceSelector cannot match).
  allowedIngressCidrs: []
  # Where cluster DNS lives. Change for node-local-dns (add its link-local IP, e.g. 169.254.20.10/32, to extraCidrs)
  # or a DNS service outside kube-system.
  dns:
    namespaceLabels: { kubernetes.io/metadata.name: kube-system }
    podLabels: { k8s-app: kube-dns }
    extraCidrs: []
  # Egress to an external LLM API. NetworkPolicy matches IPs, not hostnames, so list CIDRs.
  externalLLM:
    enabled: false
    cidrs: []
    port: 443

test:
  enabled: true
